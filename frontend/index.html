<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CMLRE Marine — Size Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <div class="logo">CMLRE Marine</div>
      <nav>
        <a href="#demo">Demo</a>
        <a href="https://cmlre.gov.in/" target="_blank" rel="noopener">Official</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-overlay">
      <h1>Predict Fish Size Classes with Ease</h1>
      <p> </p>
    </div>
  </section>

  <section id="demo" class="demo">
    <div class="demo-content">
      <div class="form-panel">
        <h2>Size Prediction</h2>
        <form id="predictForm">
          <label>
            <span>Species</span>
            <select id="species">
              <option>FishA</option>
              <option>FishB</option>
              <option>FishC</option>
              <option>FishD</option>
            </select>
          </label>
          <label>
            <span>Count</span>
            <input id="count" type="number" min="1" value="10" required />
          </label>
          <label>
            <span>Length (cm)</span>
            <input id="length" type="number" step="0.1" min="0" value="20.0" required />
          </label>
          <button type="submit">Predict</button>
        </form>
      </div>

      <div class="result-panel">
        <h2>Result</h2>
        <div id="result" class="result empty">
          <div class="message">Submit to see prediction.</div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div>© 2025 CMLRE Marine </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
